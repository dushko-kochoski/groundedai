services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: groundedai
      POSTGRES_USER: groundedai
      POSTGRES_PASSWORD: groundedai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundedai -d groundedai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://groundedai:groundedai@db:5432/groundedai
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 10485760
      CHUNK_TARGET_CHARS: 1000
      CHUNK_OVERLAP_CHARS: 150
      EMBEDDING_PROVIDER: deterministic
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: 1536
      EMBEDDING_TIMEOUT_SECONDS: 20
      EMBEDDING_MAX_RETRIES: 2
      EMBEDDING_BATCH_SIZE: 64
      RETRIEVAL_TOP_K: 5
      RETRIEVAL_MAX_TOP_K: 20
      RETRIEVAL_MIN_SCORE: 0.15
      RETRIEVAL_MAX_QUERY_CHARS: 2000
      RETRIEVAL_MAX_RETURNED_CHARS: 6000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  upload_data:
